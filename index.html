<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>India Startup Funding Deals — 2026 Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🇮🇳</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="topbar-title">
      <h1>India Startup Funding Deals</h1>
      <p class="subtitle">2026 tracker &mdash; sourced &amp; cross-verified against Entrackr, YourStory, Inc42</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="controls">
    <input id="search" type="text" placeholder="Search company, sector, investor…" autocomplete="off" />

    <div class="chip-group" id="statusChips">
      <button class="chip active" data-status="all">All</button>
      <button class="chip" data-status="confirmed">Confirmed</button>
      <button class="chip" data-status="discrepancy">Discrepancy</button>
      <button class="chip" data-status="partial">Partial</button>
      <button class="chip" data-status="unverified">Unverified</button>
      <button class="chip" data-status="notchecked">Not checked</button>
    </div>

    <select id="sectorFilter">
      <option value="">All sectors</option>
    </select>

    <select id="periodFilter">
      <option value="">All months</option>
    </select>
  </section>

  <section class="table-wrap">
    <table id="dealsTable">
      <thead>
        <tr>
          <th data-key="idx" class="col-idx sortable">#</th>
          <th data-key="name" class="sortable">Startup</th>
          <th data-key="sector" class="sortable">Sector</th>
          <th data-key="amountNum" class="col-amount sortable">Amount</th>
          <th data-key="round" class="sortable">Round</th>
          <th>Investors</th>
          <th data-key="period" class="sortable">Period</th>
          <th class="col-status">Status</th>
          <th class="col-source">Source</th>
        </tr>
      </thead>
      <tbody id="dealsBody"></tbody>
    </table>
  </section>

  <p class="empty-state" id="emptyState" hidden>No deals match your filters.</p>

</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-card">
    <button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
